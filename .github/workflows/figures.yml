name: Figures

on:
  push:
    branches: [ master ]
  workflow_dispatch: {}

jobs:
  figures-sanity:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || true
    - name: Run figures-sanity
      run: make figures-sanity
    - name: Archive previews
      uses: actions/upload-artifact@v4
      with:
        name: figures-previews
        path: figures/sanity/
